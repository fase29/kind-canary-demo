apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canary-test-www
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fase29/kind-canary-demo.git
    targetRevision: master
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: canary-test
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
